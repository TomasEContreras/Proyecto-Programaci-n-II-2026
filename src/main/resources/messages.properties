# Mensajes que Spring usa cuando NO puede convertir lo que se escribió en un campo al tipo de Java
# (por ejemplo "abc" en un campo numérico). Sin esto se muestra un error técnico en inglés.
# Spring Boot carga este archivo solo, por su nombre.
typeMismatch.java.math.BigDecimal=Ingresá un número válido (por ejemplo, 7 o 7.5)
typeMismatch.java.lang.Integer=Ingresá un número entero válido
typeMismatch.java.lang.Long=El valor elegido no es válido
typeMismatch.java.time.LocalDate=Ingresá una fecha válida
