<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - JTEducation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments/header :: header-nav"></header>

    <main class="container">
        <a class="volver" th:href="@{/cursos}">&larr; Volver al listado</a>

        <!-- Un solo formulario para alta y edición: si existe idCurso, es edición -->
        <h1 th:text="${idCurso != null} ? 'Editar curso' : 'Nuevo curso'">Nuevo curso</h1>

        <form class="formulario" th:object="${cursoForm}" method="post"
              th:action="${idCurso != null} ? @{/cursos/{id}(id=${idCurso})} : @{/cursos}">

            <!-- Errores del formulario completo (por ejemplo, curso repetido) -->
            <p class="error-campo" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <div class="campo">
                <label for="anio">Año</label>
                <input type="number" id="anio" th:field="*{anio}">
                <p class="error-campo" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></p>
            </div>

            <div class="campo">
                <label for="division">División</label>
                <select id="division" th:field="*{division}">
                    <option value="">Seleccioná una división</option>
                    <option th:each="d : ${divisiones}" th:value="${d}" th:text="${d}">A</option>
                </select>
                <p class="error-campo" th:if="${#fields.hasErrors('division')}" th:errors="*{division}"></p>
            </div>

            <!-- El ciclo lectivo no se elige: al crear es el año actual y al editar se conserva el original -->
            <div class="campo">
                <span class="etiqueta">Ciclo lectivo</span>
                <p class="dato-fijo" th:text="${idCurso != null} ? ${cicloLectivo} : ${anioActual}">2026</p>
                <small class="ayuda" th:if="${idCurso == null}">Se asigna automáticamente el año en curso.</small>
            </div>

            <!-- Plan de materias (N:M). th:field sobre un Set marca solas las materias que ya tiene el curso.
                 #ids.prev conecta cada <label> con el id que Thymeleaf generó para su checkbox. -->
            <fieldset class="campo">
                <legend>Materias del curso</legend>
                <p th:if="${#lists.isEmpty(materias)}" class="vacio">
                    No hay materias cargadas. <a th:href="@{/materias/nueva}">Creá una materia</a> primero.
                </p>
                <div class="opciones-check">
                    <div th:each="m : ${materias}">
                        <input type="checkbox" th:field="*{idsMaterias}" th:value="${m.idMateria}">
                        <label th:for="${#ids.prev('idsMaterias')}" th:text="${m.nombre}">Matemática</label>
                    </div>
                </div>
                <p class="error-campo" th:if="${#fields.hasErrors('idsMaterias')}" th:errors="*{idsMaterias}"></p>
            </fieldset>

            <div class="acciones">
                <button type="submit" class="btn">Guardar</button>
                <a th:href="@{/cursos}">Cancelar</a>
            </div>
        </form>
    </main>

    <footer th:replace="fragments/footer :: footer-main"></footer>
</body>
</html>
