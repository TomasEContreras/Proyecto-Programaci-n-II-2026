<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas - JTEducation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments/header :: header-nav"></header>

    <main class="container">
        <a class="volver" th:href="@{/alumnos/{id}(id=${alumno.idAlumno})}">&larr; Volver a la ficha del alumno</a>

        <h1 th:text="'Notas de ' + ${materia.nombre}">Notas de Matemática</h1>
        <p class="subtitulo"
           th:text="${alumno.apellido + ', ' + alumno.nombre + ' - ' + alumno.curso.anio + '° ' + alumno.curso.division}">
            Pérez, Ana - 4° A</p>

        <form class="formulario" th:object="${notaForm}" method="post"
              th:action="@{/alumnos/{idA}/notas/{idM}(idA=${alumno.idAlumno}, idM=${materia.idMateria})}">

            <!-- Errores del formulario completo (por ejemplo, materia fuera del plan) -->
            <p class="error-campo" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <!-- step="0.01" permite decimales; min/max ayudan en el navegador, pero el servidor valida igual -->
            <div class="campo">
                <label for="primerNota">1° nota</label>
                <input type="number" id="primerNota" th:field="*{primerNota}" min="1" max="10" step="0.01">
                <p class="error-campo" th:if="${#fields.hasErrors('primerNota')}" th:errors="*{primerNota}"></p>
            </div>

            <div class="campo">
                <label for="segundaNota">2° nota</label>
                <input type="number" id="segundaNota" th:field="*{segundaNota}" min="1" max="10" step="0.01">
                <p class="error-campo" th:if="${#fields.hasErrors('segundaNota')}" th:errors="*{segundaNota}"></p>
            </div>

            <div class="campo">
                <label for="notaFinal">Nota final</label>
                <input type="number" id="notaFinal" th:field="*{notaFinal}" min="1" max="10" step="0.01">
                <p class="error-campo" th:if="${#fields.hasErrors('notaFinal')}" th:errors="*{notaFinal}"></p>
            </div>

            <p class="ayuda">Dejá vacía una nota que todavía no se tomó. Si dejás las tres vacías, se borran las notas de esta materia.</p>

            <div class="acciones">
                <button type="submit" class="btn">Guardar</button>
                <a th:href="@{/alumnos/{id}(id=${alumno.idAlumno})}">Cancelar</a>
            </div>
        </form>
    </main>

    <footer th:replace="fragments/footer :: footer-main"></footer>
</body>
</html>
