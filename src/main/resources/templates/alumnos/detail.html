<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del alumno - JTEducation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments/header :: header-nav"></header>

    <main class="container">
        <a class="volver" th:href="@{/alumnos}">&larr; Volver al listado</a>

        <!-- Mensajes flash: por ejemplo, al volver de cargar notas -->
        <p th:if="${mensajeExito}" class="mensaje exito" th:text="${mensajeExito}"></p>
        <p th:if="${mensajeError}" class="mensaje error" th:text="${mensajeError}"></p>

        <div class="acciones">
            <a class="btn" th:href="@{/alumnos/{id}/editar(id=${alumno.idAlumno})}">Editar alumno</a>
            <form method="post" th:action="@{/alumnos/{id}/eliminar(id=${alumno.idAlumno})}"
                  onsubmit="return confirm('¿Seguro que querés eliminar este alumno?');">
                <button class="btn btn-peligro" type="submit">Eliminar alumno</button>
            </form>
        </div>
        <!-- Datos y notas del alumno: fragmentos de alumnos/ficha.html (los comparte con "Mi ficha") -->
        <div th:replace="~{alumnos/ficha :: datos}"></div>
        <div th:replace="~{alumnos/ficha :: notas(editable=true)}"></div>
    </main>

    <footer th:replace="fragments/footer :: footer-main"></footer>
</body>
</html>
