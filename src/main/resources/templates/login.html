<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - JTEducation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments/header :: header-nav"></header>

    <main class="container login">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresá con el email y la contraseña de tu cuenta.</p>

        <!-- Spring Security redirige a /login?error si los datos no coinciden y a /login?salir al cerrar sesión -->
        <p th:if="${param.error}" class="mensaje error">Email o contraseña incorrectos.</p>
        <p th:if="${param.salir}" class="mensaje exito">Cerraste sesión correctamente.</p>

        <!-- El POST /login lo procesa Spring Security; th:action agrega el token CSRF oculto -->
        <form class="formulario" method="post" th:action="@{/login}">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="acciones">
                <button type="submit" class="btn">Ingresar</button>
            </div>
        </form>
    </main>

    <footer th:replace="fragments/footer :: footer-main"></footer>
</body>
</html>
